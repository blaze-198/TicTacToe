databases:
  - name: tictactoe-db
    plan: free
    databaseName: nakama
    user: nakama

services:
  - type: web
    name: tictactoe-nakama
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.nakama
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tictactoe-db
          property: connectionString
      - key: PORT
        value: "7350"
