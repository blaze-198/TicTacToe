version: "3"
services:
  postgres:
    container_name: postgres-prod
    image: postgres:12.2-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=${DB_PASSWORD:-localdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nakama:
    container_name: nakama-prod
    image: heroiclabs/nakama:3.24.2
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${DB_PASSWORD:-localdb}@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:${DB_PASSWORD:-localdb}@postgres:5432/nakama --logger.level INFO --session.token_expiry_sec 7200 --config /nakama/data/local.yml
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama-server/build:/nakama/data/modules
      - ./local.yml:/nakama/data/local.yml
    ports:
      - "7350:7350"
      - "7351:7351"
    restart: unless-stopped

  frontend:
    container_name: frontend-prod
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - nakama
    restart: unless-stopped

volumes:
  pgdata:
